[project]
name = "agente-operador"
version = "0.1.0"
description = "Agente Operador: proyecto integrador del Bootcamp AI Engineer con Python, 2ª Edición."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "google-genai>=3.6.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "mcp>=2.3.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pypdf>=7.2.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "reportlab>=5.1.2",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["data/docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["agents", "core", "prompting", "context", "contracts", "knowledge", "operador_mcp", "prompts", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
