repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run ruff check
        language: system
        types_or: [python, pyi]
        pass_filenames: true

      - id: ruff-format
        name: Ruff format check
        entry: uv run ruff format --check
        language: system
        types_or: [python, pyi]
        pass_filenames: true

      - id: check-whitespace
        name: Check trailing whitespace
        entry: git diff --check --cached
        language: system
        pass_filenames: false
        always_run: true
